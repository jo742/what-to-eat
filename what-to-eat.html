<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等会儿吃什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 40px;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        header p {
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
        }

        .search-box {
            background: white;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            width: 100%;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .loading svg {
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .restaurant-list {
            background: white;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover {
            color: #667eea;
            background-color: #f8f9ff;
        }

        .tab.active {
            color: #667eea;
            background-color: #fff;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .tab-count {
            display: inline-block;
            background: #e8e8e8;
            color: #666;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .tab.active .tab-count {
            background: #667eea;
            color: white;
        }

        .list-container {
            padding: 20px;
            max-height: 450px;
            overflow-y: auto;
        }

        .restaurant-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .restaurant-item:last-child {
            border-bottom: none;
        }

        .restaurant-item:hover {
            background-color: #f8f9ff;
        }

        .restaurant-item h3 {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .restaurant-item p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 3px;
        }

        .restaurant-item .tags {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .restaurant-item .tag {
            padding: 3px 8px;
            background: #667eea;
            color: white;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        .restaurant-item .tag.cafe {
            background: #f5576c;
        }

        .restaurant-item .tag.dessert {
            background: #f093fb;
        }

        .restaurant-item .distance {
            color: #999;
            font-size: 0.85rem;
        }

        .random-selector {
            text-align: center;
        }

        .random-btn {
            padding: 20px 60px;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 25px rgba(245, 87, 108, 0.4);
        }

        .random-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 35px rgba(245, 87, 108, 0.5);
        }

        .random-btn:active {
            transform: scale(0.98);
        }

        .random-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-card {
            margin-top: 30px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card h2 {
            color: #f5576c;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .result-card .winner-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .result-card .winner-info {
            color: #666;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .result-card .winner-address {
            color: #999;
            font-size: 0.9rem;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .no-results h3 {
            margin-bottom: 10px;
        }

        .api-key-hint {
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            font-size: 0.9rem;
            text-align: center;
        }

        .api-key-hint a {
            color: #fff;
            text-decoration: underline;
        }

        .stats-bar {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-item .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-item .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .container {
                padding: 30px 20px;
                max-width: 100%;
            }

            header h1 {
                font-size: 2rem;
            }

            header p {
                font-size: 0.95rem;
            }

            .search-box {
                max-width: 100%;
                padding: 25px 20px;
                border-radius: 16px;
            }

            .search-box input {
                padding: 15px 18px;
                font-size: 1rem;
            }

            .search-box button {
                padding: 15px;
                font-size: 1rem;
            }

            .random-btn {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .result-card .winner-name {
                font-size: 1.8rem;
            }

            .tab {
                padding: 12px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ 等会儿吃什么</h1>
            <p>不知道吃什么？让我来帮你决定！</p>
        </header>

        <div id="apiKeyHint" class="api-key-hint" style="display: none;">
            ⚠️ 请先在代码中配置你的 <a href="https://console.amap.com/" target="_blank">高德地图API Key</a>
        </div>

        <div class="search-box">
            <input type="text" id="addressInput" placeholder="输入地址，例如：北京市朝阳区三里屯">
            <button id="searchBtn">搜索附近餐厅</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle class="opacity-25" cx="12" cy="12" r="10"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p style="margin-top: 15px;">正在搜索附近餐厅...</p>
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <h3>😔 没有找到附近的餐厅</h3>
            <p>请尝试更换地址或扩大搜索范围</p>
        </div>

        <div id="statsBar" class="stats-bar" style="display: none;">
            <div class="stat-item">
                <div class="number" id="totalCount">0</div>
                <div class="label">总餐厅数</div>
            </div>
            <div class="stat-item">
                <div class="number" id="restaurantCount">0</div>
                <div class="label">正餐餐厅</div>
            </div>
            <div class="stat-item">
                <div class="number" id="cafeCount">0</div>
                <div class="label">奶茶咖啡</div>
            </div>
        </div>

        <div id="restaurantList" class="restaurant-list" style="display: none;">
            <div class="tabs">
                <div class="tab active" data-tab="restaurant" onclick="switchTab('restaurant')">
                    🍽️ 餐厅 <span class="tab-count" id="tabRestaurantCount">0</span>
                </div>
                <div class="tab" data-tab="cafe" onclick="switchTab('cafe')">
                    ☕ 奶茶咖啡 <span class="tab-count" id="tabCafeCount">0</span>
                </div>
            </div>
            <div class="list-container" id="listContent"></div>
        </div>

        <div id="randomSelector" class="random-selector" style="display: none;">
            <button id="randomBtn" class="random-btn">🎲 帮我选一个！</button>
        </div>

        <div id="resultCard" class="result-card" style="display: none;">
            <h2>🎉 决定啦！</h2>
            <div class="winner-name" id="winnerName"></div>
            <div class="winner-info" id="winnerInfo"></div>
            <div class="winner-address" id="winnerAddress"></div>
        </div>
    </div>

    <script>
        const API_KEY = '4c943f0c6b8b1867323f9d53a3e0ca95';

        const addressInput = document.getElementById('addressInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('noResults');
        const restaurantList = document.getElementById('restaurantList');
        const listContent = document.getElementById('listContent');
        const randomSelector = document.getElementById('randomSelector');
        const randomBtn = document.getElementById('randomBtn');
        const resultCard = document.getElementById('resultCard');
        const winnerName = document.getElementById('winnerName');
        const winnerInfo = document.getElementById('winnerInfo');
        const winnerAddress = document.getElementById('winnerAddress');
        const apiKeyHint = document.getElementById('apiKeyHint');
        const statsBar = document.getElementById('statsBar');

        const tabs = document.querySelectorAll('.tab');

        let allRestaurants = [];
        let currentTab = 'restaurant';
        let isSelecting = false;

        // 分类关键词 - 奶茶咖啡店
        const cafeKeywords = ['奶茶', '咖啡', '茶饮', '冰饮', '拿铁', '卡布奇诺', '星冰乐', '星巴克', '瑞幸', '喜茶', '奈雪', '蜜雪冰城', '蜜雪', '一点点', 'COCO', '都可', '古茗', '益禾堂', '茶百道', '沪上阿姨', '书亦烧仙草', '茶颜悦色', '霸王茶姬', '柠季', '茶里', '乐乐茶', '吾饮良品', '鹿角巷', '7分甜', '卡旺卡', '古茗奶茶', '益禾堂奶茶', '茶颜', '茶派', '茶物语', '茶心良品', '茶味小站', '茶时光', '茶语', '茶座', '茶坊', '茶室', '茶铺', '饮品店', '果汁', '鲜榨', '果茶', '水果茶', '芝士茶', '奶盖', '贡茶', '皇茶', '鹿角', '茶丸', '茶屋', '茶社', '茶餐厅', '咖啡馆', '咖啡屋', 'coffee', 'cafe', 'cappuccino', 'espresso', 'latte', 'mocha', 'americano'];

        // 如果没有配置API Key，显示提示
        if (!API_KEY) {
            apiKeyHint.style.display = 'block';
        }

        searchBtn.addEventListener('click', async () => {
            const address = addressInput.value.trim();
            if (!address) {
                alert('请输入地址');
                return;
            }

            if (!API_KEY) {
                alert('请先在代码中配置你的高德地图API Key！\n\n申请地址：https://console.amap.com/');
                return;
            }

            resultCard.style.display = 'none';
            loading.style.display = 'block';
            noResults.style.display = 'none';
            restaurantList.style.display = 'none';
            randomSelector.style.display = 'none';
            statsBar.style.display = 'none';

            try {
                // 1. 地理编码：将地址转换为经纬度
                const geocodeUrl = `https://restapi.amap.com/v3/geocode/geo?address=${encodeURIComponent(address)}&output=JSON&key=${API_KEY}`;
                const geocodeResponse = await fetch(geocodeUrl);
                const geocodeData = await geocodeResponse.json();

                if (geocodeData.status !== '1' || geocodeData.geocodes.length === 0) {
                    throw new Error('无法解析该地址');
                }

                const location = geocodeData.geocodes[0].location;
                const [lng, lat] = location.split(',');

                // 2. 周边搜索：搜索餐饮服务，获取多页数据
                allRestaurants = [];
                let page = 1;
                let hasMore = true;
                const maxPages = 20;
                const itemsPerPage = 50;
                const searchRadius = 1000;

                while (hasMore && page <= maxPages && allRestaurants.length < 200) {
                    const nearbyUrl = `https://restapi.amap.com/v3/place/around?key=${API_KEY}&location=${lng},${lat}&radius=${searchRadius}&types=050000&offset=${itemsPerPage}&page=${page}&extensions=all&output=JSON`;
                    const nearbyResponse = await fetch(nearbyUrl);
                    const nearbyData = await nearbyResponse.json();

                    if (nearbyData.status !== '1' || nearbyData.pois.length === 0) {
                        hasMore = false;
                        break;
                    }

                    const pageRestaurants = nearbyData.pois.map(item => ({
                        name: item.name,
                        type: item.type,
                        address: item.address,
                        distance: parseInt(item.distance) || 0,
                        tel: item.tel,
                        business: item.business || ''
                    }));

                    allRestaurants = [...allRestaurants, ...pageRestaurants];
                    
                    // 检查是否还有更多
                    if (pageRestaurants.length < itemsPerPage) {
                        hasMore = false;
                    }
                    page++;
                }

                if (allRestaurants.length === 0) {
                    loading.style.display = 'none';
                    noResults.style.display = 'block';
                    return;
                }

                // 按距离排序
                allRestaurants.sort((a, b) => a.distance - b.distance);

                // 调试：输出所有餐厅数据到控制台
                console.log('=== 所有餐厅数据 ===');
                allRestaurants.forEach((item, index) => {
                    const category = getCategory(item.type + item.name);
                    console.log(`${index + 1}. [${category}] ${item.name} - ${item.type}`);
                });

                updateStats();
                renderRestaurantList();

                loading.style.display = 'none';
                statsBar.style.display = 'flex';
                restaurantList.style.display = 'block';
                randomSelector.style.display = 'block';

            } catch (error) {
                console.error(error);
                loading.style.display = 'none';
                alert('搜索失败：' + error.message);
            }
        });

        function getCategory(fullText) {
            const text = fullText.toLowerCase();

            // 第一步：优先判断奶茶咖啡品牌（完整品牌名）
            const cafeBrands = ['书亦烧仙草', '星巴克', '瑞幸', '喜茶', '奈雪', '蜜雪冰城', '蜜雪', '一点点', 'COCO', '都可', '古茗', '益禾堂', '茶百道', '沪上阿姨', '茶颜悦色', '霸王茶姬', '柠季', '茶里', '乐乐茶', '吾饮良品', '鹿角巷', '7分甜', '卡旺卡', '茶派', '茶物语', '茶心良品', '茶味小站', '茶时光'];
            for (const brand of cafeBrands) {
                if (text.includes(brand.toLowerCase())) {
                    return 'cafe';
                }
            }

            // 第二步：判断奶茶咖啡类型关键词
            const cafeTypes = ['奶茶', '咖啡', '茶饮', '冰饮', '拿铁', '卡布奇诺', '星冰乐', '饮品店', '果汁', '鲜榨', '果茶', '水果茶', '芝士茶', '奶盖', '贡茶', '皇茶', '茶丸', '茶屋', '茶社', '茶餐厅', '咖啡馆', '咖啡屋', 'coffee', 'cafe', 'cappuccino', 'espresso', 'latte', 'mocha', 'americano'];
            for (const type of cafeTypes) {
                if (text.includes(type.toLowerCase())) {
                    return 'cafe';
                }
            }

            // 默认是餐厅（甜品店、面包店等都归到餐厅）
            return 'restaurant';
        }

        function getCategoryList(category) {
            return allRestaurants.filter(item => getCategory(item.type + item.name) === category);
        }

        function updateStats() {
            const restaurantList = getCategoryList('restaurant');
            const cafeList = getCategoryList('cafe');

            document.getElementById('totalCount').textContent = allRestaurants.length;
            document.getElementById('restaurantCount').textContent = restaurantList.length;
            document.getElementById('cafeCount').textContent = cafeList.length;

            document.getElementById('tabRestaurantCount').textContent = restaurantList.length;
            document.getElementById('tabCafeCount').textContent = cafeList.length;
        }

        function switchTab(tab) {
            currentTab = tab;
            
            tabs.forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            renderRestaurantList();
        }

        function renderRestaurantList() {
            const list = getCategoryList(currentTab);

            if (list.length === 0) {
                listContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #999;">
                        <h3>😔 暂无${currentTab === 'restaurant' ? '餐厅' : currentTab === 'cafe' ? '奶茶咖啡' : '甜品'}店</h3>
                        <p>试试其他分类或更换地址</p>
                    </div>
                `;
                return;
            }

            listContent.innerHTML = list.map((item, index) => {
                const category = getCategory(item.type + item.name);
                let tagClass = '';
                if (category === 'cafe') tagClass = 'cafe';
                if (category === 'dessert') tagClass = 'dessert';
                
                return `
                    <div class="restaurant-item">
                        <h3>${index + 1}. ${item.name}</h3>
                        <p>${item.type}</p>
                        <p>${item.address}</p>
                        <div class="tags">
                            ${item.business ? `<span class="tag ${tagClass}">${item.business}</span>` : ''}
                            ${item.tel ? `<span class="tag">📞 ${item.tel}</span>` : ''}
                        </div>
                        <p class="distance">距离：${item.distance}米</p>
                    </div>
                `;
            }).join('');
        }

        randomBtn.addEventListener('click', () => {
            if (isSelecting || allRestaurants.length === 0) return;

            isSelecting = true;
            randomBtn.disabled = true;
            randomBtn.textContent = '🎲 选择中...';
            resultCard.style.display = 'none';

            let count = 0;
            const maxCount = 40;
            const interval = 80;

            const selectInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * allRestaurants.length);
                const randomRestaurant = allRestaurants[randomIndex];

                winnerName.textContent = randomRestaurant.name;
                winnerInfo.textContent = randomRestaurant.type + ' · 距离 ' + randomRestaurant.distance + '米';
                winnerAddress.textContent = randomRestaurant.address;

                count++;
                if (count >= maxCount) {
                    clearInterval(selectInterval);
                    isSelecting = false;
                    randomBtn.disabled = false;
                    randomBtn.textContent = '🎲 帮我选一个！';
                    resultCard.style.display = 'block';
                }
            }, interval);
        });

        // 支持回车键搜索
        addressInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });
    </script>
</body>
</html>
